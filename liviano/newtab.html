<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Nueva pestaña</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body data-mode="pro">
    <main>
      <header class="brand">
        <svg class="logo" viewBox="0 0 100 100" width="54" height="54" aria-hidden="true">
          <rect class="logo-bg" x="1.5" y="1.5" width="97" height="97" rx="24" />
          <polygon class="logo-bolt" points="58,12 24,56 46,56 41,88 77,43 54,43" />
        </svg>
        <div class="brand-text">
          <h1>Liviano</h1>
          <p>Menos peso, más web.</p>
        </div>
      </header>

      <form id="search" role="search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input
          id="q"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Buscar o escribir una dirección"
          aria-label="Buscar o escribir una dirección"
          autofocus
        />
      </form>

      <nav id="sites" aria-label="Sitios más visitados" hidden></nav>
    </main>

    <footer>
      <div class="dock">
        <div class="modes" role="radiogroup" aria-label="Modo">
          <button type="button" role="radio" data-mode="eco">Eco</button>
          <button type="button" role="radio" data-mode="pro">Pro</button>
          <button type="button" role="radio" data-mode="extremo">Extremo</button>
        </div>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" id="sleep" class="chip" title="Suspende las demás pestañas para liberar memoria">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <span>Suspender pestañas</span>
          <span id="sleepCount" class="count" hidden></span>
        </button>
        <button type="button" id="toggleSites" class="chip" aria-pressed="false" title="Muestra u oculta tus sitios más visitados">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <span>Sitios</span>
        </button>
        <button type="button" id="toggleText" class="chip" aria-pressed="false" title="Carga las páginas sin imágenes">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M5 6h14M12 6v13M9 19h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>Solo texto</span>
        </button>
      </div>
      <p id="note" class="note"></p>
    </footer>

    <script src="newtab.js"></script>
  </body>
</html>
